<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>SHOP</title>
<style>
body{font-family:Arial,sans-serif;background:#fff;color:#222;max-width:480px;margin:40px auto;padding:0 16px}
h1{font-family:Arial,sans-serif;color:#222;font-size:32px;margin:0 0 4px}
h2{font-family:Arial,sans-serif;color:#222;font-size:18px;font-weight:normal;margin:0 0 16px;color:#555}
a,button{font-family:Arial,sans-serif;background:#0b5fff;color:#fff;font-size:14px;border:0;padding:10px 16px;border-radius:4px;text-decoration:none;display:inline-block;cursor:pointer}
a.secondary{background:none;color:#0b5fff;padding:10px 4px}
.prix{color:#c00;font-weight:bold}
.old{color:#777;text-decoration:line-through;font-weight:normal;margin-left:6px}
</style></head>
<body>
<h1>SOLDES</h1>
<h2>Achetez maintenant</h2>
<p>Les articles en promo affichent leur <span class="prix">nouveau prix</span> en rouge, avec l'<span class="old">ancien prix</span> barré à côté.</p>
<p><button>Acheter</button> <a class="secondary" href="#">Plus d'infos</a></p>
</body></html>
